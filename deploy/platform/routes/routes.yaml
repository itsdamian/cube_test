# Browser access to the platform UIs through the shared Traefik Gateway (no port-forward).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - {name: cube, namespace: traefik, sectionName: web}
  hostnames: [argocd.localhost]
  rules:
    - backendRefs:
        - {name: argocd-server, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - {name: cube, namespace: traefik, sectionName: web}
  hostnames: [grafana.localhost]
  rules:
    - backendRefs:
        - {name: kube-prometheus-stack-grafana, port: 80}
