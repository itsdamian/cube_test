# Encrypted secrets (Sealed Secrets, spec requirement 5). Only ciphertext is committed; the
# controller in namespace sealed-secrets decrypts them with its private key. A new cluster can
# decrypt them only if that key was backed up and restored (scripts/seal-secret.sh --backup-key,
# scripts/cluster-up.sh); otherwise re-seal: docs/kubernetes.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - grafana-admin.sealed.yaml
