# The secrets are applied (sync wave -18) before the charts that own these namespaces create them
# (kube-prometheus-stack: wave -15), so the namespaces are declared here. Prune=false: removing
# this component must never delete a namespace that other components live in.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
