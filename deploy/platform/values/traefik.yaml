# Traefik as the Gateway API implementation (ingress-nginx is retired; plan). k3s' bundled
# Traefik is disabled (deploy/k3d/cluster.yaml) so this version-pinned copy is the same on any
# cluster. The Gateway API CRDs come from the gateway-api-crds component.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: false
gateway:
  name: cube                       # HTTPRoutes refer to Gateway "cube" in namespace traefik
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All                  # cube-dev, cube-prod, argocd and monitoring attach routes
service:
  type: LoadBalancer               # k3s ServiceLB; k3d maps host :80 to it
ports:
  web:
    exposedPort: 80
  websecure:
    expose:
      default: false               # no TLS locally (spec non-goal)
ingressClass:
  enabled: false                 # Ingress provider is off; routes use the Gateway API
ingressRoute:
  dashboard:
    enabled: false
resources:
  requests: {memory: 64Mi, cpu: 50m}
  limits: {memory: 128Mi}
