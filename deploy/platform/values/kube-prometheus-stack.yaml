# One Prometheus / Grafana / Alertmanager for both environments (spec requirement 21).
prometheus:
  prometheusSpec:
    retention: 3d
    # Select ALL rules / monitors, not only those labelled with this Helm release (QA K4):
    # the cube PrometheusRule, ServiceMonitor and PodMonitors carry no "release" label and
    # would otherwise be ignored silently.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {memory: 512Mi, cpu: 100m}
      limits: {memory: 1Gi}
    storageSpec:                   # keep the alert history across Prometheus restarts (task 21: 24 h)
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 5Gi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {memory: 32Mi, cpu: 10m}
      limits: {memory: 64Mi}
grafana:
  admin:
    existingSecret: grafana-admin  # created by cluster-up.sh; a SealedSecret from task 11 on
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: {memory: 128Mi, cpu: 50m}
    limits: {memory: 256Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL        # deploy/monitoring puts the cube dashboard in "monitoring"
kube-state-metrics:
  resources:
    requests: {memory: 32Mi, cpu: 10m}
    limits: {memory: 96Mi}
prometheus-node-exporter:
  resources:
    requests: {memory: 16Mi, cpu: 10m}
    limits: {memory: 48Mi}
prometheusOperator:
  resources:
    requests: {memory: 64Mi, cpu: 20m}
    limits: {memory: 128Mi}
# k3s runs these inside the k3s server process; they have no separate scrape endpoints here
# and would only show as "down" targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
