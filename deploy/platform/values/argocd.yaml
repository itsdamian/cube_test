# Argo CD, non-HA, for a local single-node cluster (plan: GitOps / Argo CD).
dex:
  enabled: false                   # local admin user only
notifications:
  enabled: false
configs:
  params:
    server.insecure: true          # TLS is not used locally; Traefik serves http://argocd.localhost
  cm:
    # The cluster is behind NAT: GitHub webhooks cannot reach it, so Argo CD polls. 60 s and no
    # jitter (defaults 120 s + up to 60 s) keep "merge to main -> dev updated" inside the 15 min
    # of the acceptance criteria (plan: CI time budget).
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 0s
    # App of apps: let the root Application wait for each child to be Healthy before moving to
    # the next sync wave (Argo CD dropped Application health in 1.8; this is the documented
    # snippet). Without it waves only order the CREATION: on a slow first build the cube apps
    # synced before kube-prometheus-stack had created its CRDs and failed for good (QA, task 15).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
controller:
  # Caches every resource it manages (kube-prometheus-stack, Strimzi and CNPG CRDs, both
  # environments): OOMKilled at 512Mi during the first GitOps sync (task 15).
  resources:
    requests: {memory: 512Mi, cpu: 100m}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {memory: 128Mi, cpu: 50m}
    limits: {memory: 256Mi}
server:
  resources:
    requests: {memory: 64Mi, cpu: 20m}
    limits: {memory: 128Mi}
applicationSet:
  resources:
    requests: {memory: 48Mi, cpu: 10m}
    limits: {memory: 96Mi}
redis:
  resources:
    requests: {memory: 32Mi, cpu: 10m}
    limits: {memory: 64Mi}
