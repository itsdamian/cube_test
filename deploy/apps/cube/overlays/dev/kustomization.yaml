# dev: smaller resources, HPA 1-2, dev.cube.localhost. Updated automatically from main
# (deploy-dev workflow writes the image tag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cube-dev
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: {kind: HTTPRoute, name: cube}
    patch: |-
      - {op: replace, path: /spec/hostnames, value: [dev.cube.localhost]}
  - target: {kind: HorizontalPodAutoscaler, name: backend-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 2}
images:
  - {name: ghcr.io/itsdamian/cube-backend, newTag: unset}
  - {name: ghcr.io/itsdamian/cube-frontend, newTag: unset}
