# dev: smaller resources, HPA 1-2, dev.cube.localhost. Updated automatically from main
# (deploy-dev workflow writes the image tag below).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cube-dev
resources:
- namespace.yaml
- ../../base
patches:
- patch: '- {op: replace, path: /spec/hostnames, value: [dev.cube.localhost]}'
  target:
    kind: HTTPRoute
    name: cube
- patch: |-
    - {op: replace, path: /spec/minReplicas, value: 1}
    - {op: replace, path: /spec/maxReplicas, value: 2}
  target:
    kind: HorizontalPodAutoscaler
    name: backend-api
images:
- digest: sha256:3db3e4bb90bd27224c971857c3abbe967fe8173c9bcbf0adb99dd7160566e59d
  name: ghcr.io/itsdamian/cube-backend
  newName: ghcr.io/itsdamian/cube-backend
  newTag: sha-d04f3f1
- digest: sha256:6b5ab954c86e0b81c5af9bef062ab314119f1e626e30969e2cd065159cc7c89c
  name: ghcr.io/itsdamian/cube-frontend
  newName: ghcr.io/itsdamian/cube-frontend
  newTag: sha-d04f3f1
