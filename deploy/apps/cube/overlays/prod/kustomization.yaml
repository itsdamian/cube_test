# prod: more headroom, HPA 2-4, two frontends, cube.localhost. Changed only by a reviewed PR
# ("prod 升級到 vX.Y.Z", opened by the release workflow and merged by a human).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cube-prod
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: {kind: HorizontalPodAutoscaler, name: backend-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
      - {op: replace, path: /spec/maxReplicas, value: 4}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
  - target: {kind: StatefulSet, name: backend-worker}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {memory: 640Mi, cpu: 200m}, limits: {memory: 800Mi}}}
  - target: {kind: KafkaNodePool, name: dual-role}
    patch: |-
      - {op: replace, path: /spec/storage/volumes/0/size, value: 5Gi}
      - {op: replace, path: /spec/resources, value: {requests: {memory: 1Gi, cpu: 250m}, limits: {memory: 1280Mi}}}
      - {op: replace, path: /spec/jvmOptions, value: {"-Xms": 768m, "-Xmx": 768m}}
  - target: {kind: Cluster, name: cube-db}
    patch: |-
      - {op: replace, path: /spec/storage/size, value: 2Gi}
      - {op: replace, path: /spec/resources, value: {requests: {memory: 320Mi, cpu: 100m}, limits: {memory: 400Mi}}}
images:
  - {name: ghcr.io/itsdamian/cube-backend, newTag: unset}
  - {name: ghcr.io/itsdamian/cube-frontend, newTag: unset}
