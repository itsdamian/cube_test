# Browser -> Traefik (Gateway "cube" in namespace traefik) -> frontend nginx, which forwards
# /api/ to backend-api exactly as in docker compose. The overlay sets the hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cube
spec:
  parentRefs:
    - {name: cube, namespace: traefik, sectionName: web}
  hostnames: [cube.localhost]
  rules:
    - backendRefs:
        - {name: frontend, port: 8080}
