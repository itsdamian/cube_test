apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/component: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101             # nginx-unprivileged
      containers:
        - name: frontend
          image: ghcr.io/itsdamian/cube-frontend
          ports: [{name: http, containerPort: 8080}]
          env:
            # Same nginx template as docker compose: /api/ (incl. SSE, unbuffered) -> backend-api.
            - {name: BACKEND_URL, value: "http://backend-api:8080"}
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 32Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
