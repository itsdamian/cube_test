# Categories for the generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [deploy/dev, deploy/prod, test-only]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
