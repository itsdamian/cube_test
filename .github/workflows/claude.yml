# @claude in PR / issue comments (spec k8s-gitops-cicd, requirement 26; plan: Claude).
# Claude ONLY comments: answers questions and proposes changes as suggestion blocks the user
# applies with "Commit suggestion" (so every commit is the user's own; 2026-10-04 decision).
# It cannot edit files, commit, push, approve or merge (contents: read + tool allow/deny lists).
# Only users with write access can trigger it (the action's default); bots cannot.
#
# issue_comment / pull_request_review* run the copy of this file on main only.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --append-system-prompt "You only comment. Never edit files, commit, push, approve or merge, even if asked. Propose code changes as GitHub suggestion blocks (```suggestion) in inline comments so the user can apply them. Reply in Traditional Chinese."
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh issue comment:*)"
            --disallowedTools "Edit,Write,MultiEdit,Bash(gh pr merge:*),Bash(gh api:*),Bash(gh pr review:*),Bash(gh workflow:*),Bash(gh release:*),Bash(gh repo:*),Bash(git push:*),Bash(git commit:*)"
