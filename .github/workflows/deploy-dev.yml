# Deploy to dev (spec k8s-gitops-cicd, requirement 14; plan: CD).
#
# When CI on main (a push, or a manual run) succeeds AND built new images, point overlays/dev at
# them (tag + digest) on the fixed branch "deploy/dev", keep ONE pull request open for it and turn
# on auto-merge. Argo CD then syncs dev from main. prod is never touched here.
#
#   - workflow_run only runs the copy of this file on main: merge it before it can trigger.
#   - The PR is opened with a GitHub App token: PRs opened with GITHUB_TOKEN do not trigger
#     workflows, so the required check ci-ok would never report and the PR could never merge.
#   - No loop: the bump only changes deploy/, CI on main then builds no images, and this
#     workflow stops at "images built?".
#   - concurrency (not cancelled): two merges in a row are bumped one after the other on the same
#     branch / PR, so an older image can never overwrite a newer one (QA C2).
#   - Never downgrades dev: scripts/dev-bump-decision.sh skips commits that are not on main or are
#     older than the one dev runs (e.g. "Re-run" of an old run); after a rewrite of main's history,
#     when dev's commit no longer exists, the bump is allowed and the PR says so.
#   - Only reads public images and writes to deploy/dev; never runs code from a pull request.
name: Deploy dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read            # read the CI run's jobs
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REGISTRY: ghcr.io/itsdamian
      BRANCH: deploy/dev
    steps:
      - name: Did that CI run build new images?
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          results=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("images (")) | .conclusion] | unique | join(",")')
          echo "image jobs: ${results:-none}"
          if [[ "$results" == "success" ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new images (deploy-only or docs change): nothing to deploy."
          fi

      - name: GitHub App token (cube-deployer)
        if: steps.built.outputs.built == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.built.outputs.built == 'true'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Point overlays/dev at sha-<7>@digest
        if: steps.built.outputs.built == 'true'
        id: bump
        run: |
          tag="sha-${SHA::7}"
          overlay=deploy/apps/cube/overlays/dev
          # The first newTag (cube-backend) stands for both: this workflow always bumps backend and
          # frontend together to the same sha-<7>.
          newtag() { sed -n 's/^ *newTag: //p' | head -1; }
          current=$(newtag < "$overlay/kustomization.yaml")
          # A bump PR may still be open: deploy/dev then already points at a newer image than main.
          pending=$(git show "origin/$BRANCH:$overlay/kustomization.yaml" 2>/dev/null | newtag || true)
          # Never downgrade dev: a manual re-run of an old run, or a run from a commit that is not
          # on main, is skipped (successfully - nothing is broken). See the script for the rules.
          note=""
          for against in "$current" ${pending:+"$pending"}; do
            decision=$(scripts/dev-bump-decision.sh "$SHA" "$against" origin/main)
            echo "CI built $tag, compared with $against: $decision"
            if [[ "$decision" == skip:* ]]; then
              echo "### Deploy dev skipped"$'\n\n'"This run built \`$tag\`; compared with \`$against\` (main: \`${current:-?}\`, $BRANCH: \`${pending:-none}\`). ${decision#skip: }." >> "$GITHUB_STEP_SUMMARY"
              echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [[ "$decision" == bump-unknown-current && "$against" == "$current" ]]; then
              note="Note: current sha ${current:-?} not found in the history of main (rewritten?); allowing bump."
              echo "::notice::$note"
            fi
          done
          echo "note=$note" >> "$GITHUB_OUTPUT"
          args=()
          for image in cube-backend cube-frontend; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$image:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$digest" == sha256:* ]] || { echo "::error::no digest for $image:$tag"; exit 1; }
            args+=("$REGISTRY/$image=$REGISTRY/$image:$tag@$digest")
          done
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w "/repo/$overlay" \
            registry.k8s.io/kustomize/kustomize:v5.8.0@sha256:98424842862ed35fa666dbaac02159623567e1e9e184d91382fa665e89023258 edit set image "${args[@]}"
          git diff --stat
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit to deploy/dev, open or update the PR, enable auto-merge
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TAG: ${{ steps.bump.outputs.tag }}
          NOTE: ${{ steps.bump.outputs.note }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "deploy(dev): $TAG" -m "Built by CI run $RUN_ID from $SHA."
          git push --force origin "$BRANCH"
          body="Points the dev environment at the images CI built from $SHA ($TAG, pinned by digest). Merged automatically once ci-ok passes; Argo CD then syncs dev. prod is not changed.${NOTE:+ $NOTE}"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --head "$BRANCH" --base main --label deploy/dev \
              --title "deploy(dev): $TAG" --body "$body" | grep -oE '[0-9]+$')
          else
            # An open bump PR (still waiting for ci-ok) is updated in place: same PR, new image.
            gh pr edit "$pr" --title "deploy(dev): $TAG" --body "$body"
          fi
          gh pr merge "$pr" --auto --squash
          echo "PR #$pr: dev -> $TAG (auto-merge on)"
