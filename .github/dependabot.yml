# Dependency update PRs (spec k8s-gitops-cicd, requirement 19). They run the full CI like any PR
# (no secrets needed). Minor / patch updates are grouped per ecosystem to keep the PR count low.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule: {interval: weekly}
